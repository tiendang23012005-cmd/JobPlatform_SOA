x-service: &svc
  restart: unless-stopped
  depends_on:
    sqlserver:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports: ["14330:1433"]
    volumes: ["sqldata:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  identity-api:
    <<: *svc
    build:
      context: .
      args:
        PROJECT: src/Services/Identity.Api
        DLL: Identity.Api.dll
    environment:
      ConnectionStrings__Default: "Server=sqlserver;Database=IdentityDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY}"
      RabbitMq__Host: rabbitmq
    ports: ["5001:8080"]

  job-api:
    <<: *svc
    build:
      context: .
      args:
        PROJECT: src/Services/Job.Api
        DLL: Job.Api.dll
    environment:
      ConnectionStrings__Default: "Server=sqlserver;Database=JobDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY}"
      RabbitMq__Host: rabbitmq
      Services__Identity: "http://identity-api:8080/"
    ports: ["5002:8080"]

  contract-api:
    <<: *svc
    build:
      context: .
      args:
        PROJECT: src/Services/Contract.Api
        DLL: Contract.Api.dll
    environment:
      ConnectionStrings__Default: "Server=sqlserver;Database=ContractDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY}"
      RabbitMq__Host: rabbitmq
      ASPNETCORE_ENVIRONMENT: "Development"
    ports: ["5003:8080"]

  payment-api:
    <<: *svc
    restart: unless-stopped
    build:
      context: .
      args:
        PROJECT: src/Services/Payment.Api
        DLL: Payment.Api.dll
    environment:
      ConnectionStrings__Default: "Server=sqlserver;Database=PaymentDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY}"
      RabbitMq__Host: rabbitmq
      Services__Identity: "http://identity-api:8080/"
      ASPNETCORE_ENVIRONMENT: "${PAYMENT_ENVIRONMENT:-Production}"
      PaymentSimulator__Enabled: "${PAYMENT_SIMULATOR_ENABLED:-false}"
      PaymentSimulator__SigningKey: "${PAYMENT_SIMULATOR_SIGNING_KEY:-}"
      PaymentSimulator__CallbackBaseUrl: "http://localhost:8080/"
    ports: ["5004:8080"]

  notification-api:
    <<: *svc
    build:
      context: .
      args:
        PROJECT: src/Services/Notification.Api
        DLL: Notification.Api.dll
    environment:
      ConnectionStrings__Default: "Server=sqlserver;Database=NotificationDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY}"
      RabbitMq__Host: rabbitmq
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__User: "${SMTP_USER:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__From: "${SMTP_FROM:-no-reply@jobplatform.local}"
    ports: ["5005:8080"]

  gateway:
    restart: unless-stopped
    build:
      context: .
      args:
        PROJECT: src/ApiGateway
        DLL: ApiGateway.dll
    environment:
      Jwt__Key: "${JWT_KEY}"
    ports: ["5000:8080"]
    depends_on: [identity-api, job-api, contract-api, payment-api, notification-api]

volumes:
  sqldata: {}
