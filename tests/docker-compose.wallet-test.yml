services:
  sqlserver:
    ports: !reset []
  rabbitmq:
    ports: !reset []
  identity-api:
    ports: !reset []
  job-api:
    ports: !reset []
  contract-api:
    ports: !reset []
  payment-api:
    ports: !override ["127.0.0.1:5504:8080"]
    environment:
      WalletReconciliation__IntervalSeconds: "2"
  notification-api:
    ports: !reset []
    environment:
      Smtp__Host: ""
  gateway:
    ports: !override ["127.0.0.1:5500:8080"]
    environment:
      Cors__Origins__1: "http://localhost:5510"
